server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

          routes:
            - id: userservice-public
              uri: lb://userservice
              predicates:
                - Path=/api/v1/public/**
              

            - id: userservice-protected
              uri: lb://userservice
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: JwtHeaderFilter

            - id: product
              uri: lb://productservice
              predicates:
                - Path=/api/v1/product/**
              filters:
                - name: JwtHeaderFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1

            - id: employee
              uri: lb://employeeservice
              predicates:
                - Path=/api/v1/employee/**
              filters:
                - name: JwtHeaderFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: order
              uri: lb://orderservice
              predicates:
                - Path=/api/v1/order/**
              filters:
                - name: JwtHeaderFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/shopping

eureka:
  instance:
    hostname: localhost

  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.cloud.gateway: DEBUG